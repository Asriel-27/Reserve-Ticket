<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi Tiket Bioskop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Bioskop Reservation</h1>
            <div class="status-bar">
                <div class="status-item">
                    <span class="label">Tersedia:</span>
                    <span class="value" id="availableCount">-</span>
                </div>
                <div class="status-item">
                    <span class="label">Terpesan:</span>
                    <span class="value" id="bookedCount">-</span>
                </div>
                <div class="status-item">
                    <span class="indicator" id="connectionStatus"></span>
                    <span class="label" id="connectionText">Connecting...</span>
                </div>
            </div>
        </header>

        <main class="main">
            <section class="theater-section">
                <div class="screen">LAYAR</div>
                <div class="seat-grid" id="seatGrid">
                    <!-- Seats generated by JS -->
                </div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-box available"></div>
                        <span>Tersedia</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-box selected"></div>
                        <span>Dipilih</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-box booked"></div>
                        <span>Terpesan</span>
                    </div>
                </div>
            </section>

            <section class="action-section">
                <div class="card">
                    <h2>Pesan Kursi</h2>
                    <div class="form-group">
                        <label for="selectedSeat">Kursi Dipilih</label>
                        <input type="text" id="selectedSeat" readonly placeholder="Pilih kursi dari denah">
                    </div>
                    <div class="form-group">
                        <label for="bookingName">Nama Pemesan</label>
                        <input type="text" id="bookingName" placeholder="Masukkan nama Anda">
                    </div>
                    <button class="btn btn-primary" id="bookBtn">Pesan Sekarang</button>
                </div>

                <div class="card">
                    <h2>Batalkan Pesanan</h2>
                    <div class="form-group">
                        <label for="cancelSeat">Nomor Kursi</label>
                        <input type="text" id="cancelSeat" placeholder="Contoh: A1">
                    </div>
                    <div class="form-group">
                        <label for="cancelName">Nama Pemesan</label>
                        <input type="text" id="cancelName" placeholder="Nama pemesan asli">
                    </div>
                    <button class="btn btn-secondary" id="cancelBtn">Batalkan Pesanan</button>
                </div>
            </section>
        </main>

        <div class="toast" id="toast"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
